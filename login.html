<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в личный кабинет</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-box { max-width: 400px; margin: 5rem auto; padding: 2rem; background: rgba(10,10,10,0.8); border-radius: 28px; text-align: center; }
        .login-box input { width: 100%; margin-bottom: 1rem; }
        .login-box button { width: 100%; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Вход в анкету</h2>
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Пароль" required>
        <button id="loginBtn">Войти</button>
        <div id="loginMessage"></div>
    </div>
    <script>
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const msg = document.getElementById('loginMessage');
            if (!email || !password) {
                msg.innerHTML = 'Заполните все поля';
                return;
            }
            try {
                const res = await fetch('api/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok && data.token) {
                    localStorage.setItem('f1_token', data.token);
                    window.location.href = 'profile.html';
                } else {
                    msg.innerHTML = 'Неверный email или пароль';
                }
            } catch (err) {
                msg.innerHTML = 'Ошибка сервера';
            }
        });
    </script>
</body>
</html>
