<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в личный кабинет | F1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
    <div class="login-card">
        <h2>🔐 ВХОД В АНКЕТУ</h2>
        <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
        <input type="password" id="loginPassword" placeholder="Пароль" autocomplete="current-password">
        <button id="loginBtn">Войти</button>
        <div id="loginMessage" class="message"></div>
        <div style="margin-top: 1rem; font-size: 0.8rem;">
            <a href="index.html" style="color: #e10600;">← На главную</a>
        </div>
    </div>
    <script>
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const msg = document.getElementById('loginMessage');
            if (!email || !password) {
                msg.innerHTML = '❌ Заполните все поля';
                return;
            }
            try {
                const res = await fetch('api/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok && data.token) {
                    localStorage.setItem('f1_token', data.token);
                    window.location.href = 'profile.html';
                } else {
                    msg.innerHTML = '❌ Неверный email или пароль';
                }
            } catch (err) {
                msg.innerHTML = '❌ Ошибка сервера';
            }
        });
    </script>
</body>
</html>
