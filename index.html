<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Формула 1 — слайдер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- навигационная панель -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="brand">
                <img class="logo" src="./images/f1 logo.png" alt="F1 Logo" onerror="this.onerror=null; this.style.opacity='0.5'; this.alt='Logo not found';">
                <span class="brand-title">ФОРМУЛА 1</span>
            </div>
            <button class="hamburger" id="hamburgerBtn" aria-label="Меню">
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
                <span class="hamburger-line"></span>
            </button>
            <ul class="nav-links" id="navLinks">
                <li><a href="#">Главная</a></li>
                <li><a href="#">Гонки</a></li>
                <li><a href="#">Команды</a></li>
                <li><a href="#">Контакты</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <!-- Огромная надпись -->
        <div class="hero-title">ФОРМУЛА 1</div>

        <!-- Слайдер -->
        <div class="slider-container">
            <button class="slider-btn prev-btn" id="prevBtn">&#10094;</button>
            <div class="slider-track" id="sliderTrack"></div>
            <button class="slider-btn next-btn" id="nextBtn">&#10095;</button>
        </div>
        <div class="slider-dots" id="sliderDots"></div>

        <!-- ДИНАМИЧЕСКАЯ ТАБЛИЦА РЕЗУЛЬТАТОВ (загружается из API) -->
        <div id="race-results-table"></div>

        <!-- БЛОК ОБРАТНОГО ОТСЧЁТА -->
        <div id="next-race-countdown" class="countdown-container">
            <div class="loading-indicator">Загрузка информации о следующей гонке...</div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
